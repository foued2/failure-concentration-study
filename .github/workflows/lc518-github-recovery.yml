name: LC518 GitHub recovery preflight

on:
  push:
    branches:
      - gpt/lc518-github-recovery-2026-11-02
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lc518-github-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-preflight:
    name: Verify package on GitHub-hosted Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13.5"

      - name: Verify archive, package hash chain, and synthetic tests
        run: python scripts/lc518_github_recovery_introspect.py

      - name: Audit launcher configuration without executing it
        run: python scripts/lc518_launcher_static_audit.py

      - name: Upload immutable run evidence and audited source files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lc518-github-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            lc518-github-recovery-report.json
            lc518-github-recovery-report.txt
            lc518-launcher-static-audit.txt
            ${{ runner.temp }}/lc518-recovery-work-*/RECOVERY_TEST_RERUN.txt
            ${{ runner.temp }}/lc518-recovery-work-*/lc518_launcher.py
            ${{ runner.temp }}/lc518-recovery-work-*/execution_protocol_v1.json
            ${{ runner.temp }}/lc518-recovery-work-*/lc518_generator.py
            ${{ runner.temp }}/lc518-recovery-work-*/test_lc518_generator.py
            ${{ runner.temp }}/lc518-recovery-work-*/test_lc518_launcher.py
