name: LC518 GitHub recovery preflight

on:
  push:
    branches:
      - gpt/lc518-github-recovery-2026-11-02

permissions:
  contents: read

concurrency:
  group: lc518-github-recovery-${{ github.ref }
  cancel-in-progress: false

jobs:
  recovery-preflight:
    name: Verify package on GitHub-hosted Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.5"
          cache: ""

      - name: Verify archive, package hash chain, and synthetic tests
        run: python scripts/lc518_github_recovery_introspect.py

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lc518-github-recovery-${{ github.run_id }-${{ github.run_attempt }
          if-no-files-found: ignore
          retention-days: 90
          path: |
            lc518-github-recovery-report.json
            lc518-github-recovery-report.txt
            ${{ runner.temp }/lc518-recovery-work-*/RECOVERY_TEST_RERUN.txt
