name: H3 V9 hosted Windows verification

on:
  push:
    branches:
      - work/h3-v9-battery-hosted-agent-path-2026-10-28
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-v9-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h3-v9-hosted-verification:
    name: Host regression tests and fail-closed gate
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: h3-footprint-v9

    steps:
      - name: Check out the committed work branch
        uses: actions/checkout@v4

      - name: Record the actual hosted environment
        run: |
          $report = [ordered]@{
            timestamp = (Get-Date).ToString("o")
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            workspace = $env:GITHUB_WORKSPACE
            working_directory = (Get-Location).Path
            python = (python --version 2>&1 | Out-String).Trim()
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$env:RUNNER_TEMP\h3-v9-environment.json"
          $report | ConvertTo-Json -Depth 4

      - name: Run the complete host regression suite
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\h3-v9-unit-tests.txt"
          if ($LASTEXITCODE -ne 0) {
            throw "Host regression suite failed with exit code $LASTEXITCODE."
          }

      - name: Verify committed manifest
        run: |
          python make_manifest.py --check
          if ($LASTEXITCODE -ne 0) {
            throw "Manifest verification failed."
          }

      - name: Verify the real execution gate still refuses candidate evaluation
        run: |
          python controller.py --check-execution-gate 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\h3-v9-gate-check.txt"
          $gateExitCode = $LASTEXITCODE
          if ($gateExitCode -ne 2) {
            throw "Expected fail-closed gate exit code 2; received $gateExitCode."
          }

      - name: Publish host verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v9-hosted-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\h3-v9-environment.json
            ${{ runner.temp }}\h3-v9-unit-tests.txt
            ${{ runner.temp }}\h3-v9-gate-check.txt
          if-no-files-found: warn
          retention-days: 14
