name: H3 V9 local Windows verification

on:
  push:
    branches:
      - work/h3-v9-battery-hosted-agent-path-2026-10-28

# Deliberately no pull_request trigger: this workflow targets a machine-local
# runner and must only execute commits explicitly pushed to the trusted work branch.
permissions:
  contents: read

concurrency:
  group: h3-v9-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h3-v9-local-verification:
    name: Host tests and fixed-fixture Sandbox checks
    runs-on: [self-hosted, Windows, X64, h3-v9-local]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: h3-footprint-v9
    env:
      H3_RUN_ROOT: C:\v9-stage\h3-local-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the trusted work branch
        uses: actions/checkout@v4

      - name: Confirm interactive Windows session and Sandbox prerequisites
        run: |
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -eq 0) {
            throw "This runner is in Session 0. Start the runner interactively with run.cmd; do not install it as a Windows service, because the Sandbox GUI must launch in the logged-in session."
          }

          $feature = Get-CimInstance Win32_OptionalFeature -Filter "Name='Containers-DisposableClientVM'"
          $sandboxExe = Join-Path $env:WINDIR "System32\WindowsSandbox.exe"
          $computer = Get-CimInstance Win32_ComputerSystem
          if (-not $feature -or $feature.InstallState -ne 1) {
            throw "Windows Sandbox optional feature is not enabled."
          }
          if (-not (Test-Path -LiteralPath $sandboxExe)) {
            throw "WindowsSandbox.exe is missing."
          }
          if (-not $computer.HypervisorPresent) {
            throw "Hypervisor is not running."
          }
          "Interactive session $sessionId; Windows Sandbox feature, executable, and hypervisor verified."

      - name: Run host regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify repository manifest
        run: python make_manifest.py --check

      - name: Verify the scientific execution gate remains closed
        run: |
          python controller.py --check-execution-gate
          $gateExitCode = $LASTEXITCODE
          if ($gateExitCode -ne 2) {
            throw "Expected the fail-closed gate to refuse evaluation with exit code 2; got $gateExitCode."
          }

      - name: Prepare a fresh run directory
        run: |
          if (Test-Path -LiteralPath $env:H3_RUN_ROOT) {
            throw "Run directory already exists; refusing to reuse prior evidence: $env:H3_RUN_ROOT"
          }
          New-Item -ItemType Directory -Path $env:H3_RUN_ROOT | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:H3_RUN_ROOT "in") | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:H3_RUN_ROOT "out") | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:H3_RUN_ROOT "work") | Out-Null

      - name: Stage and verify the pinned embeddable Python runtime
        run: |
          $pythonRoot = Join-Path $env:H3_RUN_ROOT "py-embed"
          python evidence/stage_python_runtime.py --dest $pythonRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Python runtime staging failed."
          }

      - name: Run fixed-fixture Sandbox isolation battery only
        run: |
          $inbox = Join-Path $env:H3_RUN_ROOT "in"
          $outbox = Join-Path $env:H3_RUN_ROOT "out"
          $work = Join-Path $env:H3_RUN_ROOT "work"
          $pythonRoot = Join-Path $env:H3_RUN_ROOT "py-embed"
          $config = Join-Path $env:H3_RUN_ROOT "isolation-battery.wsb"
          $report = Join-Path $env:H3_RUN_ROOT "isolation-battery.json"

          python isolation_battery.py --inbox $inbox --outbox $outbox --work-root $work --python-root $pythonRoot --config $config --report $report --launch
          if ($LASTEXITCODE -ne 0) {
            throw "Fixed-fixture Sandbox battery failed or was incomplete. Review the report and archived raw evidence."
          }

      - name: Publish bounded local evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v9-local-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.H3_RUN_ROOT }}
          if-no-files-found: warn
          retention-days: 14
