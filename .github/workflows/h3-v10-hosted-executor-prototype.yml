name: H3 V10 hosted execution prototype

on:
  push:
    branches:
      - work/h3-v10-hosted-executor-prototype-2026-10-29
    paths-ignore:
      - "h3-footprint-v10-cloud/README.md"
      - ".github/workflows/h3-v10-provider-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h3-v10-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tests:
    name: Existing V9 host tests on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        shell: pwsh
        working-directory: h3-footprint-v9
    steps:
      - name: Check out source for trusted tests only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full host regression suite
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\h3-v9-tests.txt"
          if ($LASTEXITCODE -ne 0) { throw "Host test suite failed." }
      - name: Test the direct-provider adapter without API calls
        run: |
          python -m unittest discover -s ..\h3-footprint-v10-cloud\tests -v
          if ($LASTEXITCODE -ne 0) { throw "Provider adapter tests failed." }
      - name: Verify repository manifest
        run: |
          python make_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw "Manifest check failed." }
      - name: Verify the real gate still blocks candidate evaluation
        run: |
          $pythonExe = (Get-Command python -ErrorAction Stop).Source
          $out = Join-Path $env:RUNNER_TEMP "gate.stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "gate.stderr.txt"
          $p = Start-Process -FilePath $pythonExe -ArgumentList @("controller.py", "--check-execution-gate") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
          if (Test-Path $err) { Get-Content $err | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 2) { throw "Expected fail-closed exit code 2; got $($p.ExitCode)." }
      - name: Upload trusted host-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-host-tests-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\h3-v9-tests.txt
            ${{ runner.temp }}\gate.stdout.txt
            ${{ runner.temp }}\gate.stderr.txt
          if-no-files-found: warn
          retention-days: 14

  package-cloud-executor:
    name: Package only the trusted hosted executor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
      - name: Package exact executor files and checksums
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-trusted-executor"
          mkdir -p "$root"
          cp h3-footprint-v10-cloud/run_container_candidate.py "$root/"
          cp h3-footprint-v10-cloud/isolated_supervisor.py "$root/"
          cp h3-footprint-v10-cloud/candidate_child.py "$root/"
          (cd "$root" && sha256sum candidate_child.py isolated_supervisor.py run_container_candidate.py > SHA256SUMS)
          (cd "$root" && sha256sum --check SHA256SUMS)
      - name: Publish trusted executor package
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-trusted-executor-${{ github.sha }}
          path: ${{ runner.temp }}/h3-v10-trusted-executor
          if-no-files-found: error
          retention-days: 7

  package-public-probe-fixture:
    name: Package only the 30 public probe inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted probe definitions
        uses: actions/checkout@v4
      - name: Build input-only fixture with no expected answers
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-public-probe-fixture"
          python h3-footprint-v10-cloud/build_smoke_fixture.py --out-dir "$root"
          (cd "$root" && sha256sum --check SHA256SUMS)
          python - "$root/fixture-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data["probe_count"] == 30, data
          assert data["expected_answers_in_fixture"] is False, data
          assert data["model_generated"] is False, data
          print(json.dumps({
              "status": "PASS",
              "probe_count": data["probe_count"],
              "expected_answers_in_fixture": False,
              "model_generated": False
          }, indent=2))
          PY
      - name: Publish public-input fixture
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-public-probe-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/h3-v10-public-probe-fixture
          if-no-files-found: error
          retention-days: 7

  keyless-container-boundary-smoke:
    name: Keyless isolated-container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Intentionally no checkout: this job must not download the repository,
      # the oracle, candidate labels, or model-provider credentials.
      - name: Create disposable canary and harmless probe fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-container-smoke"
          mkdir -p "$root/candidate" "$root/inputs" "$root/out"
          chmod 755 "$root" "$root/candidate" "$root/inputs"
          chmod 777 "$root/out"
          printf 'HOST-ONLY-CANARY-DO-NOT-MOUNT\n' > "$root/host-only-canary.txt"
          printf '{"probe":"harmless-smoke","value":17}\n' > "$root/inputs/probe.json"
          cat > "$root/candidate/probe.py" <<'PY'
          import json
          import os
          import socket
          from pathlib import Path

          result = {
              "uid": os.getuid(),
              "input_readable": False,
              "input_value": None,
              "output_writable": False,
              "host_canary_visible": False,
              "rootfs_write_allowed": None,
              "network_connected": None,
              "pids_max": None,
              "memory_max": None,
              "cpu_max": None,
          }
          try:
              payload = json.loads(Path("/inputs/probe.json").read_text())
              result["input_readable"] = True
              result["input_value"] = payload.get("value")
          except Exception as exc:
              result["input_error"] = type(exc).__name__
          try:
              result["host_canary_visible"] = (
                  "HOST-ONLY-CANARY-DO-NOT-MOUNT" in Path("/host-only-canary.txt").read_text()
              )
          except OSError:
              result["host_canary_visible"] = False
          try:
              Path("/rootfs-write-probe").write_text("must fail")
              result["rootfs_write_allowed"] = True
          except OSError:
              result["rootfs_write_allowed"] = False
          try:
              with socket.create_connection(("1.1.1.1", 443), timeout=1.5):
                  result["network_connected"] = True
          except OSError:
              result["network_connected"] = False
          for name, key in (
              ("/sys/fs/cgroup/pids.max", "pids_max"),
              ("/sys/fs/cgroup/memory.max", "memory_max"),
              ("/sys/fs/cgroup/cpu.max", "cpu_max"),
          ):
              try:
                  result[key] = Path(name).read_text().strip()
              except OSError:
                  pass
          try:
              Path("/out/result.json").write_text(json.dumps(result, sort_keys=True) + "\n")
              result["output_writable"] = True
              # Rewrite after setting the output control.
              Path("/out/result.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          except OSError:
              raise SystemExit(31)
          PY
          cat "$root/candidate/probe.py"

      - name: Pull runtime image and run without oracle, repository, or credentials
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-container-smoke"
          image="python:3.14-slim"
          docker pull "$image"
          docker image inspect "$image" > "$root/image-inspect.json"
          id="$(docker create             --name h3-v10-container-smoke             --network none             --read-only             --pids-limit 8             --memory 536870912             --cpus 1             --user 65534:65534             --security-opt no-new-privileges             --cap-drop ALL             --tmpfs /tmp:rw,noexec,nosuid,size=64m             --mount "type=bind,source=$root/candidate,target=/candidate,readonly"             --mount "type=bind,source=$root/inputs,target=/inputs,readonly"             --mount "type=bind,source=$root/out,target=/out"             "$image" python -I /candidate/probe.py)"
          printf '%s\n' "$id" > "$root/container-id.txt"
          set +e
          docker start --attach "$id"
          rc=$?
          set -e
          docker inspect "$id" > "$root/container-inspect.json"
          docker logs "$id" > "$root/container-stdout.txt" 2> "$root/container-stderr.txt" || true
          docker rm "$id" > /dev/null
          if [ "$rc" -ne 0 ]; then
            echo "Container exited with code $rc" >&2
            exit "$rc"
          fi

      - name: Validate observed behavior and enforced container settings
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-container-smoke"
          python - "$root" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          report = json.loads((root / "out" / "result.json").read_text())
          config = json.loads((root / "container-inspect.json").read_text())[0]
          host = config["HostConfig"]

          assert report["uid"] == 65534, report
          assert report["input_readable"] is True and report["input_value"] == 17, report
          assert report["output_writable"] is True, report
          assert report["host_canary_visible"] is False, report
          assert report["rootfs_write_allowed"] is False, report
          assert report["network_connected"] is False, report

          assert host["NetworkMode"] == "none", host
          assert host["ReadonlyRootfs"] is True, host
          assert host["PidsLimit"] == 8, host
          assert host["Memory"] == 536870912, host
          assert host["NanoCpus"] == 1000000000 or (host["CpuQuota"] == 100000 and host["CpuPeriod"] == 100000), host
          assert "ALL" in host["CapDrop"], host
          assert any("no-new-privileges" in item for item in host["SecurityOpt"]), host
          mounts = {m["Destination"]: m for m in config["Mounts"]}
          assert set(mounts) == {"/candidate", "/inputs", "/out"}, mounts
          assert mounts["/candidate"]["RW"] is False
          assert mounts["/inputs"]["RW"] is False
          assert mounts["/out"]["RW"] is True
          print(json.dumps({
              "status": "PASS",
              "scope": "one harmless smoke body on one ephemeral GitHub-hosted Ubuntu runner",
              "uid": report["uid"],
              "input_readable": report["input_readable"],
              "output_writable": report["output_writable"],
              "host_canary_visible": report["host_canary_visible"],
              "rootfs_write_allowed": report["rootfs_write_allowed"],
              "network_connected": report["network_connected"],
              "pids_max": report["pids_max"],
              "memory_max": report["memory_max"],
              "cpu_max": report["cpu_max"],
              "container_settings_verified": True,
              "repository_checked_out_in_this_job": False,
              "oracle_or_expected_answers_present_in_this_job": False,
              "generated_solvers_run": False
          }, indent=2))
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-keyless-container-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-v10-container-smoke
          if-no-files-found: warn
          retention-days: 14

  isolated-candidate-executor-smoke:
    name: One-candidate executor and process-tree timeout control
    needs: [package-cloud-executor, package-public-probe-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      # No checkout: the VM receives only three hash-pinned trusted executor files.
      - name: Download trusted executor package
        uses: actions/download-artifact@v4
        with:
          name: h3-v10-trusted-executor-${{ github.sha }}
          path: ${{ runner.temp }}/h3-v10-executor-package

      - name: Download input-only 30-probe fixture
        uses: actions/download-artifact@v4
        with:
          name: h3-v10-public-probe-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/h3-v10-public-probe-fixture

      - name: Verify trusted package and create a fixed harmless solver fixture
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/h3-v10-executor-package"
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          mkdir -p "$root/candidate"
          (cd "$package" && sha256sum --check SHA256SUMS)
          test "$(find "$package" -maxdepth 1 -type f | wc -l)" -eq 4
          printf 'HOST-ONLY-CANARY-DO-NOT-MOUNT\n' > "$root/host-only-canary.txt"
          cp "$package/run_container_candidate.py" "$root/run_container_candidate.py"
          cat > "$root/candidate/body.py" <<'PY'
          def solve(n, edges, s, t):
              import os
              import socket
              from pathlib import Path

              flags = 0
              if os.getuid() == 65534:
                  flags |= 1
              try:
                  Path("/rootfs-write-probe").write_text("must fail")
                  flags |= 32
              except OSError:
                  flags |= 2
              if not Path("/host-only-canary.txt").exists():
                  flags |= 4
              try:
                  Path("/dev/shm/h3-write-probe").write_text("must fail")
                  flags |= 128
              except OSError:
                  flags |= 16
              try:
                  with socket.create_connection(("1.1.1.1", 443), timeout=0.5):
                      flags |= 64
              except OSError:
                  flags |= 8
              return n * 100 + flags
          PY
          cat > "$root/probes.json" <<'JSON'
          [
            {"probe_id":"smoke-a","n":5,"edges":[],"s":0,"t":4},
            {"probe_id":"smoke-b","n":7,"edges":[],"s":0,"t":6}
          ]
          JSON
          cat > "$root/candidate/timeout_body.py" <<'PY'
          def solve(n, edges, s, t):
              import subprocess
              import sys
              import time
              subprocess.Popen([sys.executable, "-c", "import time; time.sleep(30)"])
              while True:
                  time.sleep(0.05)
          PY
          cat > "$root/timeout-probes.json" <<'JSON'
          [{"probe_id":"timeout-tree-control","n":5,"edges":[],"s":0,"t":4}]
          JSON
          cat "$root/candidate/body.py"

      - name: Run bounded two-input smoke without repository, oracle, or credentials
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/h3-v10-executor-package"
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          python "$root/run_container_candidate.py" \
            --body "$root/candidate/body.py" \
            --trusted-dir "$package" \
            --probes-json "$root/probes.json" \
            --out "$root/execution-report.json" \
            --probe-timeout 5 --response-timeout 12
          cat "$root/execution-report.json"

      - name: Validate per-input records and enforced boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          python - "$root/execution-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["isolation_harness_ok"] is True, report
          assert report["probe_count"] == 2, report
          assert report["all_trees_empty"] is True, report
          assert report["reference_answers_present"] is False, report
          assert report["host_repository_mounted"] is False, report
          assert report["api_keys_passed_to_container"] is False, report
          assert [r["probe_id"] for r in report["results"]] == ["smoke-a", "smoke-b"], report
          assert [r["answer"] for r in report["results"]] == [531, 731], report
          assert all(r["status"] == "ok" and r["tree_empty"] is True for r in report["results"]), report
          assert all(report["container_config"]["checks"].values()), report
          print(json.dumps({
              "status": "PASS",
              "scope": "two hand-authored harmless inputs; no generated candidates",
              "probe_ids": [r["probe_id"] for r in report["results"]],
              "answers": [r["answer"] for r in report["results"]],
              "container_config_verified": report["container_config"]["verified"],
              "all_trees_empty": report["all_trees_empty"],
              "candidate_generation_performed": False,
              "scoring_performed": False,
          }, indent=2))
          PY

      - name: Run the fixed control across all 30 frozen V3 probe inputs
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/h3-v10-executor-package"
          fixture="$RUNNER_TEMP/h3-v10-public-probe-fixture"
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          (cd "$fixture" && sha256sum --check SHA256SUMS)
          python "$root/run_container_candidate.py" \
            --body "$fixture/smoke-body.py" \
            --trusted-dir "$package" \
            --probes-json "$fixture/probes.json" \
            --out "$root/v3-30-probe-report.json" \
            --probe-timeout 5 --response-timeout 12

      - name: Verify module-load failures are excluded before probe scoring
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/h3-v10-executor-package"
          fixture="$RUNNER_TEMP/h3-v10-public-probe-fixture"
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          printf 'def solve(:\\n    pass\\n' > "$root/candidate/load-error-body.py"
          python "$root/run_container_candidate.py" \
            --body "$root/candidate/load-error-body.py" \
            --trusted-dir "$package" \
            --probes-json "$fixture/probes.json" \
            --out "$root/load-error-report.json" \
            --probe-timeout 2 --response-timeout 8
          python - "$root/load-error-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["isolation_harness_ok"] is True, report
          assert report["candidate_valid"] is False, report
          assert report["candidate_status"] == "load_error", report
          assert report["probe_count"] == 0, report
          assert report["expected_probe_count"] == 30, report
          assert report["preflight"]["status"] == "load_error", report
          assert report["all_trees_empty"] is True, report
          print(json.dumps({
              "status": "PASS",
              "control": "invalid Python module fails preflight and is excluded before k assignment",
              "candidate_status": report["candidate_status"],
              "probe_count": report["probe_count"],
              "expected_probe_count": report["expected_probe_count"],
              "candidate_generation_performed": False,
          }, indent=2))
          PY

      - name: Run the adversarial process-tree timeout control
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/h3-v10-executor-package"
          root="$RUNNER_TEMP/h3-v10-executor-smoke"
          python "$root/run_container_candidate.py" \
            --body "$root/candidate/timeout_body.py" \
            --trusted-dir "$package" \
            --probes-json "$root/timeout-probes.json" \
            --out "$root/timeout-report.json" \
            --probe-timeout 1 --response-timeout 8
          cat "$root/timeout-report.json"
          python - "$root/timeout-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["isolation_harness_ok"] is True, report
          result = report["results"][0]
          assert result["status"] == "timeout", result
          assert result["timed_out"] is True, result
          assert result["tree_empty"] is True, result
          print(json.dumps({
              "status": "PASS",
              "control": "child spawned a 30-second grandchild and looped; supervisor timed out and cleaned the container process tree",
              "result_status": result["status"],
              "tree_empty": result["tree_empty"],
              "candidate_generation_performed": False,
          }, indent=2))
          PY

      - name: Upload candidate-executor smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-executor-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-v10-executor-smoke
          if-no-files-found: warn
          retention-days: 14

  score-fixed-control-smoke:
    name: Score the fixed harness control in a separate VM
    needs: isolated-candidate-executor-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out only for trusted reference scoring
        uses: actions/checkout@v4
      - name: Download untrusted execution predictions
        uses: actions/download-artifact@v4
        with:
          name: h3-v10-executor-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-v10-executor-smoke
      - name: Download public fixture manifest
        uses: actions/download-artifact@v4
        with:
          name: h3-v10-public-probe-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/h3-v10-public-probe-fixture
      - name: Verify fixture and score only the fixed control
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/h3-v10-public-probe-fixture"
          runroot="$RUNNER_TEMP/h3-v10-executor-smoke"
          (cd "$fixture" && sha256sum --check SHA256SUMS)
          python h3-footprint-v10-cloud/score_smoke_report.py \
            --report "$runroot/v3-30-probe-report.json" \
            --fixture-manifest "$fixture/fixture-manifest.json" \
            --out "$runroot/v3-30-probe-scoring-report.json"
      - name: Upload separate-job scoring record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-v10-fixed-control-score-${{ github.run_id }}
          path: ${{ runner.temp }}/h3-v10-executor-smoke/v3-30-probe-scoring-report.json
          if-no-files-found: warn
          retention-days: 14
